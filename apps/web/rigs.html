<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Inspeção de rigs — B.A.R.</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#232831;color:#eee;font:14px system-ui,sans-serif}canvas{width:100%;height:100%;display:block}
  #controls{position:absolute;left:16px;right:16px;top:16px;padding:12px 16px;border:1px solid #626b78;border-radius:8px;background:#20252eed;display:flex;gap:12px;align-items:center;flex-wrap:wrap}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;padding:6px;background:#3b4656;color:white;border:1px solid #778394;border-radius:4px}button{cursor:pointer}#time{width:200px}#status{width:100%;font-size:12px;color:#c4cddb}#names{position:absolute;inset:0;pointer-events:none}#names span{position:absolute;transform:translateX(-50%);text-align:center;text-shadow:0 1px 3px black;font-weight:600}#hint{position:absolute;bottom:12px;left:16px;right:16px;color:#c4cddb;font-size:12px}
</style>
<canvas id="world"></canvas>
<div id="controls">
  <strong>Inspeção de rigs</strong>
  <label>Personagem <select id="skin"><option value="all">Todos</option></select></label>
  <label>Clipe <select id="clip"><option value="bind">Pose de bind</option></select></label>
  <button id="play" type="button">Reproduzir</button>
  <label>Tempo <input id="time" type="range" min="0" max="1" step="0.01" value="0"><output id="clock">0,00 s</output></label>
  <label><input id="skeleton" type="checkbox">Esqueleto</label>
  <label><input id="reference" type="checkbox">Fonte original (dourado)</label>
  <label><input id="sequence" type="checkbox">Testar sequência</label>
  <label>Vista <select id="view"><option value="front">Frente</option><option value="side">Lado</option><option value="back">Costas</option></select></label>
  <div id="status">Carregando modelos e bancos de animação…</div>
</div>
<div id="names"></div>
<div id="hint">Comparação isolada dos assets e do conversor usados pelo jogo. “Banco” usa os GLBs por skin; “Bar” usa o retarget em tempo de execução. Sem mapa, props ou deslocamento de rede.</div>
<script type="module" src="./rigs.js"></script>
</html>
