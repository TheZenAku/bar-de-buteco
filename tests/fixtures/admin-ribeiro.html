<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<!-- The administration console on Administração › Ribeiro with a made-up admin.world snapshot (no server): fixture.sent lists what the section sent, fixture.answer(ok,message) answers the last command like the room does, fixture.push(patch) changes the shop. -->
<div class="modal-backdrop"><section class="modal admin-modal"><header class="modal-header"><h2>Administração do bar</h2></header><div id="modal-content"><div id="admin-console"></div></div></section></div>
<script type="module">
import '../../apps/web/src/neon-ui.css';
import '../../apps/web/src/assets/fonts/neon-ui.css';
import '../../apps/web/src/admin.css';
import {adminConsole} from '../../apps/web/src/admin/console.ts';
const now=Date.now(),MIN=60000,DAY=86400000,id=(n,k)=>`${k}${String(n).padStart(7,'0')}-0000-4000-8000-000000000000`;
const weapons=['pistola','revolver','submetralhadora','fuzil','fuzil-ak','carabina','escopeta','cano-duplo','dmr','precisao'];
const brDay=at=>new Date(at-3*3600000).toISOString().slice(0,10);
const members=[
  {userId:'11111111-1111-4111-8111-111111111111',name:'Rafael Ribeiro',role:'owner',hiredAt:now-12*DAY,earned:4720,online:true},
  {userId:'22222222-2222-4222-8222-222222222222',name:'Bianca Torres',role:'manager',hiredAt:now-8*DAY,earned:3180,online:true},
  {userId:'33333333-3333-4333-8333-333333333333',name:'Caio Mendes',role:'employee',hiredAt:now-5*DAY,earned:2410,online:false},
  {userId:'44444444-4444-4444-8444-444444444444',name:'Davi Albuquerque de Souza Lima',role:'employee',hiredAt:now-2*DAY,earned:960,online:true}];
const statuses=['queued','queued','to-cut','cutting','cut-ready','machining','to-drill','drilling','drilled-ready','assembling'];
const orders=[];
for(let i=0;i<46;i++){
  const status=i<statuses.length?statuses[i]:i%7===0?'cancelled':'completed',createdAt=now-(i*3.1)*3600000-i*MIN;
  const station=({cutting:'cut-2','cut-ready':'cut-1',machining:'machine-1','to-drill':'machine-2',drilling:'drill-3','drilled-ready':'drill-1',assembling:'assembly-2','to-cut':''})[status]??'';
  orders.push({id:id(i+1,'a'),weapon:weapons[i%weapons.length],status,operatorId:members[i%4].userId,operatorName:members[i%4].name,stationId:station,createdAt,updatedAt:status==='completed'?createdAt+(6+i%9)*MIN:now-(status==='queued'?35:i)*MIN});
}
const jobs=[
  {stationId:'cut-2',orderId:orders[3].id,stage:'cut',operatorId:members[1].userId,startedAt:now-3000,endsAt:now+5000},
  {stationId:'machine-1',orderId:orders[5].id,stage:'machining',operatorId:members[2].userId,startedAt:now-7000,endsAt:now+3000},
  {stationId:'drill-3',orderId:orders[7].id,stage:'drill',operatorId:members[0].userId,startedAt:now-1000,endsAt:now+6000},
  {stationId:'assembly-2',orderId:orders[9].id,stage:'assembly',operatorId:members[3].userId,startedAt:now-9000,endsAt:now+3000}];
const statusCount={};for(const o of orders)statusCount[o.status]=(statusCount[o.status]??0)+1;
const producedByWeapon={};for(const o of orders)if(o.status==='completed')producedByWeapon[o.weapon]=(producedByWeapon[o.weapon]??0)+1;
const daily=Array.from({length:14},(_,i)=>{const day=brDay(now-(13-i)*DAY);return {day,opened:[0,2,3,1,4,5,3,6,2,4,7,3,5,6][i],completed:[0,1,3,2,3,4,4,5,2,3,6,3,4,5][i],paid:[0,640,1180,420,1560,1990,1370,2210,700,1240,2630,980,1740,2120][i]};});
const stages=['cut','machining','drill','assembly'],pay={cut:80,machining:110,drill:90,assembly:160};
const payroll=Array.from({length:60},(_,i)=>{const stage=stages[i%4];return {id:id(i,'p'),userId:members[i%4].userId,name:members[i%4].name,amount:pay[stage],label:`Etapa ${stage} · ${orders[i%orders.length].id.slice(1,7).toUpperCase()}`,orderId:orders[i%orders.length].id,at:now-i*47*MIN};});
const paidByStage={};for(const p of payroll){const s=p.label.split(' ')[1];paidByStage[s]=(paidByStage[s]??0)+p.amount;}
const ribeiro={revision:210,materials:{ACO:7,ALUMINIO:42,POLIMERO:0,MOLAS:12},stock:{pistola:3,fuzil:1,escopeta:2,'cano-duplo':0,dmr:1},completed:orders.filter(o=>o.status==='completed').length,jobs,members,
  orders:orders.slice(0,150),totalOrders:orders.length,statusCount,daily,producedByWeapon,averageMinutes:9.4,payroll,paidByStage,paidTotal:payroll.reduce((s,p)=>s+p.amount,0),
  purchaseOrders:[{id:id(1,'f'),material:'POLIMERO',pallets:2,status:'open',createdAt:new Date(now-12*MIN).toISOString()},{id:id(2,'f'),material:'ACO',pallets:3,status:'accepted',createdAt:new Date(now-50*MIN).toISOString()},{id:id(3,'f'),material:'MOLAS',pallets:1,status:'completed',createdAt:new Date(now-5*3600000).toISOString()},{id:id(4,'f'),material:'ALUMINIO',pallets:4,status:'cancelled',createdAt:new Date(now-DAY).toISOString()}],
  carriers:[{userId:members[1].userId,name:members[1].name,orderId:orders[2].id,weapon:orders[2].weapon,stage:'raw'},{userId:members[3].userId,name:members[3].name,orderId:orders[8].id,weapon:orders[8].weapon,stage:'finished'}]};
const players=[...members.map(m=>({id:m.userId,name:m.name,connected:m.online,x:0,y:0,z:0,animation:'idle',interaction:'',job:'',condition:'normal'})),{id:'55555555-5555-4555-8555-555555555555',name:'Eduarda Lopes',connected:true,x:0,y:0,z:0,animation:'idle',interaction:'',job:'',condition:'normal'}];
const snapshot={at:now,occupancy:5,capacity:40,event:'',walletRetries:0,resultOutbox:0,prices:{},players,npcs:[],waiter:{phase:'',queue:[]},counterQueue:[],jobs:[],media:[],ribeiro};
const sent=[];
const hooks={performance:{},user:()=>({id:'admin',displayName:'Rafael',isOwner:true,role:'admin'}),send:(type,payload)=>{sent.push({type,payload});},position:()=>'0, 0, 0',changedWallet:()=>{},denied:()=>{}};
const consoleApi=adminConsole(document.querySelector('#admin-console'),hooks);
document.querySelector('[data-admin-nav="ribeiro"]').click();
const feed=extra=>{snapshot.at=Date.now();consoleApi.world({...JSON.parse(JSON.stringify(snapshot)),...extra});};
feed();
window.fixture={sent,feed,ribeiro,snapshot,answer(ok,message){const last=sent.filter(s=>s.type==='admin.ribeiro').at(-1);feed({ribeiroResult:{requestId:last.payload.requestId,ok,message}});},push(patch){Object.assign(ribeiro,patch);ribeiro.revision++;feed();},api:consoleApi};
</script></body></html>
