<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Horse audio</title>
<button>Ativar áudio</button><script type="module">
import {HorseSounds} from '/src/engine/horse-sound.ts';
const fixture=window.fixture={volume:1,horses:[],ear:{x:0,y:1,z:0}};
