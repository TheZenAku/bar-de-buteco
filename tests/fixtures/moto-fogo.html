<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Caveira em Chamas</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}</style><canvas id="world"></canvas><script type="module">
import {BarScene} from '/src/engine/BarScene.ts';
import {DEFAULT_ENVIRONMENT,MOTO_FOGO_MODEL,MOTO_LIGHT,NEW_MOTO_PARTS,STOPPED_VEHICLE,parkedMoto,stepMoto} from '../../packages/shared/src/index.ts';
const start={x:18,y:0,z:7,yaw:Math.PI/2},state={...parkedMoto({id:'fogo',...start}),model:new URLSearchParams(location.search).get('model')??MOTO_FOGO_MODEL,plate:'ZBN6H07',parts:NEW_MOTO_PARTS,engine:2,headlights:1,lights:0,riderId:'driver'};
const world={players:{driver:{id:'driver',displayName:'driver',skin:'nathan',color:'#ffffff',x:18,y:0,z:7,rotation:state.yaw,animationState:'ride',animationStartedAt:Date.now(),interactionState:'moto:fogo',currentTableId:'',lastProcessedInput:0,connected:true}},npcs:{},tables:{},motos:{fogo:state},event:{id:'',type:'',startedAt:0,durationMs:0},occupancy:1,capacity:32,serverTime:Date.now(),environment:{...DEFAULT_ENVIRONMENT,hour:12,paused:true,weather:'clear'}};
let moving=false,steer=0,reverse=false,orbit=[5,2.2,6],look=.6;
const scene=new BarScene(document.querySelector('canvas'),{onMediaFrame:()=>{
  const bike=[...scene.motos.all()].find(v=>v.state.id==='fogo');if(!bike)return;
  const p=bike.entity.getPosition(),f=bike.entity.forward,r=bike.entity.right;
  // the camera in the bike's frame: orbit = [right, up, back]
  scene.camera.setPosition(p.x+r.x*orbit[0]+f.x*orbit[2],p.y+orbit[1],p.z+r.z*orbit[0]+f.z*orbit[2]);scene.camera.lookAt(p.x,p.y+look,p.z);
  scene.environment.sky.setPosition(scene.camera.getPosition());scene.app.autoRender=true;
}});
scene.setWorld(world,'driver');scene.setEnabled(false);
scene.app.on('update',dt=>{if(moving){Object.assign(state,stepMoto(state,{throttle:reverse?-1:1,steer,brake:false},Math.min(dt,.05)));state.ticks++;world.serverTime=Date.now();scene.setWorld(world,'driver');}});
const bike=()=>[...scene.motos.all()].find(v=>v.state.id==='fogo');
window.fixture={scene,ready:scene.ready,status:()=>scene.getMotos(),
  fire:()=>bike()?.fire?.telemetry(),
  wheelFire:level=>{const f=bike()?.fire;if(f){f.follow=false;f.fire=level;}},
  exhaust:()=>bike()?.exhaust,exhaustTelemetry:()=>bike()?.exhaust?.telemetry(),paintTelemetry:()=>bike()?.paint?.telemetry(),
  wheels:()=>{const b=bike();if(!b)return undefined;const at=n=>b.rig.ponto(n).getPosition().toArray().map(v=>+v.toFixed(4));
    return {front:at('roda_dianteira'),rear:at('roda_traseira'),fireFront:at('fogo_diant'),fireRear:at('fogo_tras'),plate:at('ponto_placa')};},
  set:patch=>{Object.assign(state,patch);scene.setWorld(world,'driver');},
  hour:hour=>{world.environment.hour=hour;scene.setWorld(world,'driver');},
  camera:(right,up,back,at=.6)=>{orbit=[right,up,back];look=at;},
  brake:on=>{state.lights=on?MOTO_LIGHT.BRAKE:0;scene.setWorld(world,'driver');},
  blink:side=>{state.lights=side==='left'?MOTO_LIGHT.LEFT:side==='right'?MOTO_LIGHT.RIGHT:0;scene.setWorld(world,'driver');},
  drive:(on,turn=0,back=false)=>{moving=on;steer=turn;reverse=back;},
  stop:()=>{moving=false;Object.assign(state,STOPPED_VEHICLE);state.steer=0;scene.setWorld(world,'driver');}};
</script></html>
