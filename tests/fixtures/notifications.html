<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><button id="outside">Fora da notificação</button><div class="toasts" id="notices"></div><script type="module">
import '../../apps/web/src/neon-ui.css';
import '../../apps/web/src/assets/fonts/neon-ui.css';
import {createNotifications} from '../../apps/web/src/notifications.ts';
let now=0,sequence=0;
const timers=new Map();
const scheduler={
  now:()=>now,
  setTimeout(callback,delay){const id=++sequence;timers.set(id,{at:now+Math.max(0,delay),callback});return id;},
  clearTimeout(id){timers.delete(id);},
  queueMicrotask(callback){queueMicrotask(callback);},
};
function advance(milliseconds){
  const end=now+milliseconds;
  for(;;){
    const due=[...timers].filter(([,timer])=>timer.at<=end).sort((a,b)=>a[1].at-b[1].at||a[0]-b[0])[0];
    if(!due)break;
    const [id,timer]=due;timers.delete(id);now=timer.at;timer.callback();
  }
  now=end;
}
window.fixture={...createNotifications(document.querySelector('#notices'),scheduler),advance};
</script></body></html>
