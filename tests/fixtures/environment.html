<!doctype html><html lang="pt-BR"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Boteco lighting</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
<canvas id="world"></canvas><script type="module">
import {BarScene} from '/src/engine/BarScene.ts';
import {DAY_NIGHT} from '/src/engine/day-night.ts';
let timestamp=DAY_NIGHT.epochMs+(12-DAY_NIGHT.offsetHours)/24*DAY_NIGHT.durationMs;
Date.now=()=>timestamp;
const scene=new BarScene(document.querySelector('canvas'));
let eye=[18,9,16],target=[14,1.8,-6];
scene.onMediaFrame=()=>{scene.camera.setPosition(...eye);scene.camera.lookAt(...target);scene.app.autoRender=true;};
window.fixture={scene,ready:scene.ready,hour:hour=>{timestamp=DAY_NIGHT.epochMs+(hour-DAY_NIGHT.offsetHours)/24*DAY_NIGHT.durationMs;},
event:type=>scene.updateState({players:[],npcs:[],event:{type}},''),view:(position,look)=>{eye=position;target=look;},
pixels:()=>new Promise(resolve=>scene.app.once('postrender',()=>{const canvas=document.createElement('canvas');canvas.width=48;canvas.height=32;const c=canvas.getContext('2d');c.drawImage(document.querySelector('#world'),0,0,48,32);resolve([...c.getImageData(0,0,48,32).data]);}))};
</script></html>
