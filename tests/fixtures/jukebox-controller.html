<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Jukebox controller fixture</title><div id="app"><canvas id="world"></canvas><main id="panel"></main></div><script type="module">
import '/src/assets/fonts/neon-ui.css';import '/src/neon-ui.css';import '/src/jukebox.css';
import {JukeboxController} from '/src/jukebox.ts';
import {initialJukebox,commandJukebox,endMedia,failMedia,liveMedia} from '../../packages/shared/src/jukebox.ts';
const state=initialJukebox('jukebox');const world={players:{alice:{id:'alice',x:15.7,y:.3,z:-10.56}},jukeboxes:{jukebox:state}};
let connected=true,projection=null;const sent=[],errors=[];
// The room's reducers, as the server runs them; a refusal comes back as the server's error does.
const reports={'jukebox.ended':endMedia,'jukebox.failed':failMedia,'jukebox.live':liveMedia};
const controller=new JukeboxController({now:()=>Date.now(),send:(type,payload)=>{sent.push({type,payload});const current=world.jukeboxes.jukebox;
  try{
    if(type==='jukebox.command')world.jukeboxes.jukebox=commandJukebox(current,payload,{id:'alice',name:'Alice'},Date.now(),{key:`k${sent.length}`,title:''});
    else if(reports[type])world.jukeboxes.jukebox=reports[type](current,payload,'alice',Date.now())??current;
    else return;
  }catch(error){errors.push(error.message);controller.reject(error.message);return;}
  controller.setWorld(world,'alice',connected);},project:()=>projection,clear:()=>false,screen:()=>{},ambient:value=>window.fixtureAmbient=value});
const panel=document.querySelector('#panel');panel.style.cssText='position:fixed;inset:0 380px 0 0;overflow:auto;padding:20px;z-index:4';
const open=()=>{panel.innerHTML=controller.panelHtml('jukebox');controller.attachPanel(panel);};open();controller.setWorld(world,'alice',true);
const timer=setInterval(()=>controller.frame(),50);
window.fixture={controller,world,sent,errors,open,close:()=>{controller.detachPanel();panel.replaceChildren();},position:(x,y,z)=>{world.players.alice={id:'alice',x,y,z};controller.setWorld(world,'alice',connected);},connection:value=>{connected=value;controller.setWorld(world,'alice',connected);},projection:value=>projection=value,teardown:()=>{clearInterval(timer);controller.destroy();}};
</script></html>
