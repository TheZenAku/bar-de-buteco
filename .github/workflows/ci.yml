name: Verificar B.A.R.
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # setup-node must not invoke the runner's older npm inside this workspace:
      # devEngines requires npm 11.20+, including for `npm config get cache`.
      - run: npm install --global npm@11.20.0
        working-directory: ${{ runner.temp }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm11-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run seed -w @bar/api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # setup-node must not invoke the runner's older npm inside this workspace:
      # devEngines requires npm 11.20+, including for `npm config get cache`.
      - run: npm install --global npm@11.20.0
        working-directory: ${{ runner.temp }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm11-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-e2e
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # setup-node must not invoke the runner's older npm inside this workspace:
      # devEngines requires npm 11.20+, including for `npm config get cache`.
      - run: npm install --global npm@11.20.0
        working-directory: ${{ runner.temp }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm11-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run test:load
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-carga
          path: test-results/load-report.json
          if-no-files-found: error
          retention-days: 14

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bar_ci
          POSTGRES_USER: bar
          POSTGRES_PASSWORD: bar-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bar -d bar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # setup-node must not invoke the runner's older npm inside this workspace:
      # devEngines requires npm 11.20+, including for `npm config get cache`.
      - run: npm install --global npm@11.20.0
        working-directory: ${{ runner.temp }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node24-npm11-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm run test:postgres -w @bar/api
        env:
          TEST_DATABASE_URL: postgresql://bar:bar-ci-password@127.0.0.1:5432/bar_ci
